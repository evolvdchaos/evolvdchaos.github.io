<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameNight</title>
<style>
  :root { --bg:#faf8ff; --ink:#1d1840; --muted:#5c5584; --accent:#6a4cf0; --link:#5a3fe0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#15112b; --ink:#ffffff; --muted:#b7aedd; --accent:#9c86ff; --link:#b39cff; } }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif; line-height:1.6; }
  .band { height:6px; background:linear-gradient(90deg,var(--accent),#ff5c97 140%); }
  main { max-width:640px; margin:0 auto; padding:3rem 1.5rem; }
  h1 { font-size:2.2rem; margin:0 0 .5rem; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 2rem; }
  a { color:var(--link); }
  ul { list-style:none; padding:0; display:flex; flex-direction:column; gap:.6rem; }
</style>
</head>
<body>
<div class="band"></div>
<main>
  <h1>GameNight</h1>
  <p>Party games for friends. Pass one phone around, or play online across everyone's phones.</p>
  <ul>
    <li><a href="https://apps.apple.com/gb/app/gamenight-party-games/id6805662354">Get it on the App Store</a></li>
    <li><a href="/support/">Support</a></li>
    <li><a href="/privacy/">Privacy Policy</a></li>
  </ul>
</main>
</body>
</html>
